# ตั้งค่า SonarQube สำหรับ KU VIN (monorepo: apps/api, apps/mobile, apps/web-dashboard)
# รันด้วย sonar-scanner จาก root ของ repo — วิธีรันดูที่ docs/SONARQUBE.md
sonar.projectKey=ku-vin
sonar.projectName=KU VIN
sonar.sourceEncoding=UTF-8

# โค้ดที่ตรวจ: ทั้ง 3 แอป + docker compose สำหรับ dev
sonar.sources=apps,docker
# ไม่ตรวจไฟล์ที่ระบบสร้างให้/ของที่ไม่ใช่โค้ดเรา: dependency, ไฟล์ build, โปรเจกต์ Android ที่ Capacitor สร้าง,
# migration SQL ที่ Prisma generate และรูปที่ผู้ใช้อัปโหลด
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,apps/mobile/android/**,apps/api/prisma/migrations/**,apps/api/uploads/**,apps/api/scripts/**

# ชุดทดสอบอัตโนมัติ (npm run test:*) แยกเป็น test code ไม่นับรวมกับ source
sonar.tests=apps/api/scripts
sonar.test.inclusions=apps/api/scripts/test-*.js

# code coverage ของ API จากชุดทดสอบระดับ service: cd apps/api && npm run test:coverage (สร้างไฟล์นี้) แล้วคัดลอกเข้าโฟลเดอร์สแกน — ดู docs/SONARQUBE.md
sonar.javascript.lcov.reportPaths=apps/api/coverage/lcov.info

# coverage นับเฉพาะโค้ด API: หน้าจอ React (mobile/dashboard) ทดสอบด้วย Playwright e2e ซึ่งขับเบราว์เซอร์จริงและไม่ได้ออกรายงาน coverage
# ให้ Sonar อ่านได้ จึงไม่นับรวม (ไม่ใช่การซ่อนผล — ดูเหตุผลและข้อจำกัดใน docs/SONARQUBE.md)
sonar.coverage.exclusions=apps/mobile/**,apps/web-dashboard/**,apps/api/prisma/**,docker/**
