server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: เส้นทางที่ React Router จัดการเอง (เช่น /driver/home) ไม่มีไฟล์จริงตรง path นั้น
    # ต้อง fallback กลับไป index.html เสมอ ไม่งั้น refresh หน้าไหนที่ไม่ใช่ "/" จะได้ 404 จาก nginx
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ไฟล์ asset ที่ Vite ใส่ hash ในชื่อไว้แล้ว (เปลี่ยนเนื้อหา = เปลี่ยนชื่อไฟล์) แคชได้ยาวอย่างปลอดภัย
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
