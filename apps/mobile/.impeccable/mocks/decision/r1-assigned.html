<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --board:#006664; --board-dk:#004A49; --zone:#CFE6C8; --bldg:#E8D5A8; --here:#C62828; --ground:#EEF2EC; --ink:#14212E; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { width:390px; height:844px; overflow:hidden; font-family:"Anuphan",sans-serif; color:var(--ink); background:var(--ground); position:relative; }
  .bar { height:62px; background:var(--board); color:#fff; display:flex; align-items:center; justify-content:space-between; padding:12px 16px 0; }
  .bar b { font:700 18px "Anuphan"; }
  .bar small { display:block; font:500 12px "Anuphan"; opacity:.85; }
  .bar .sos { font:700 13px "Anuphan"; background:var(--here); padding:8px 12px; border-radius:6px; }
  .map { position:relative; height:356px; background:var(--ground); border-bottom:2px solid var(--board); overflow:hidden; }
  .zone { position:absolute; left:28px; top:22px; width:300px; height:300px; border-radius:50%; background:var(--zone); border:2px dashed #4E7A44; }
  .zone-lbl { position:absolute; left:40px; top:30px; font:700 12px "Anuphan"; color:#2F5228; background:rgba(255,255,255,.85); padding:2px 8px; border-radius:4px; }
  .road { position:absolute; background:#fff; }
  .b { position:absolute; background:var(--bldg); border:1.5px solid #B99A5C; border-radius:3px; }
  .num { position:absolute; width:28px; height:28px; border-radius:50%; background:var(--board); color:#fff; font:700 14px "Anuphan"; display:flex; align-items:center; justify-content:center; border:2px solid #fff; }
  .num.sel { background:#fff; color:var(--board); border:3px solid var(--board); }
  .here { position:absolute; left:206px; top:236px; width:20px; height:20px; border-radius:50%; background:var(--here); border:4px solid #fff; box-shadow:0 0 0 2px var(--here); }
  .here-lbl { position:absolute; left:150px; top:262px; font:700 12px "Anuphan"; color:#fff; background:var(--here); padding:3px 8px; border-radius:4px; }
  .legend { padding:12px 16px 0; }
  .legend h3 { font:600 13px "Anuphan"; color:#4A5866; margin-bottom:6px; }
  .row { display:grid; grid-template-columns:30px 1fr auto; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid #C9D2CC; font:600 15px "Anuphan"; }
  .row i { width:26px; height:26px; border-radius:50%; background:var(--board); color:#fff; font:700 13px "Anuphan"; font-style:normal; display:flex; align-items:center; justify-content:center; }
  .row.sel { background:#fff; margin:0 -16px; padding:9px 16px; border-left:5px solid var(--board); }
  .row small { display:block; font:400 12px "Anuphan"; color:#4A5866; }
  .row b { font:700 18px "Anuphan"; }
  .go { position:absolute; left:16px; right:16px; bottom:86px; height:56px; border-radius:8px; background:var(--board); color:#fff; font:700 19px "Anuphan"; display:flex; align-items:center; justify-content:center; }
  .tabs { position:absolute; left:0; right:0; bottom:0; height:72px; background:#fff; border-top:2px solid var(--board); display:grid; grid-template-columns:repeat(4,1fr); padding-top:10px; }
  .tabs div { text-align:center; font:600 12px "Anuphan"; color:#4A5866; }
  .tabs b { display:block; width:22px; height:22px; margin:0 auto 4px; border:2px solid currentColor; border-radius:5px; }
  .tabs .cur { color:var(--board); }
</style>
</head>
<body>
  <div class="bar"><div><b>มก. กำแพงแสน</b><small>แผนผังพื้นที่ · โหมดผู้โดยสาร</small></div><div class="sos">SOS</div></div>
  <div class="map">
    <div class="zone"></div><div class="zone-lbl">เขตเหมาจ่าย 20 ฿</div>
    <div class="road" style="left:0;right:0;top:170px;height:10px"></div>
    <div class="road" style="top:0;bottom:0;left:188px;width:10px"></div>
    <div class="b" style="left:70px;top:90px;width:70px;height:46px"></div>
    <div class="b" style="left:236px;top:80px;width:64px;height:60px"></div>
    <div class="b" style="left:90px;top:220px;width:60px;height:50px"></div>
    <div class="b" style="left:250px;top:230px;width:56px;height:44px"></div>
    <div class="num sel" style="left:92px;top:98px">1</div>
    <div class="num" style="left:254px;top:96px">2</div>
    <div class="num" style="left:106px;top:232px">3</div>
    <div class="num" style="left:340px;top:300px">4</div>
    <div class="here"></div><div class="here-lbl">คุณอยู่ที่นี่ · หอพักนิสิต</div>
  </div>
  <div class="legend">
    <h3>เลือกปลายทางจากแผนผัง</h3>
    <div class="row sel"><i>1</i><div>สำนักหอสมุด<small>ในเขต · 1.4 กม.</small></div><b>20 ฿</b></div>
    <div class="row"><i>2</i><div>โรงอาหารกลาง<small>ในเขต · 0.9 กม.</small></div><b>20 ฿</b></div>
    <div class="row"><i>4</i><div>ตลาดกำแพงแสน<small>นอกเขต · 6.2 กม.</small></div><b>62 ฿</b></div>
  </div>
  <div class="go">เรียกวินไป ① สำนักหอสมุด</div>
  <div class="tabs"><div class="cur"><b></b>เรียกวิน</div><div><b></b>ทริปของฉัน</div><div><b></b>แจ้งเตือน</div><div><b></b>บัญชี</div></div>
</body>
</html>
