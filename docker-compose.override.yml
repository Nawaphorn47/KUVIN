# ใช้เฉพาะเครื่อง dev (docker compose อ่านไฟล์นี้ต่อจาก docker-compose.yml ให้อัตโนมัติ)
# บน VPS ไม่ copy ไฟล์นี้ไป — ฐานข้อมูลจึงไม่เปิด port ออกนอก
services:
  db:
    ports:
      # 127.0.0.1 เท่านั้น (ไม่ใช่ 0.0.0.0) — 5533 ไม่ชนกับ PostgreSQL ในเครื่อง (5432) และ docker/ เดิม (5433)
      - "127.0.0.1:${DB_PORT:-5533}:5432"
