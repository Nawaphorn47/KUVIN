# Nginx reverse proxy ของ KU VIN (3 โดเมนย่อย) — ติดตั้งบน VPS ในฐานะ root:
#   sed 's/example\.com/kuvinn.tech/g' /home/deploy/app/nginx.conf > /etc/nginx/sites-available/kuvin
#   ln -s /etc/nginx/sites-available/kuvin /etc/nginx/sites-enabled/kuvin
#   rm -f /etc/nginx/sites-enabled/default
#   nginx -t && systemctl reload nginx
#
# HTTPS (หลัง DNS ชี้มาที่ VPS แล้ว):
#   certbot --nginx -d kuvinn.tech -d api.kuvinn.tech -d admin.kuvinn.tech --redirect
#   (certbot จะแก้ไฟล์บน VPS เพิ่ม listen 443 และ redirect ให้เอง)

# Socket.IO ใช้ WebSocket — ต้องส่ง header Upgrade ต่อให้ API
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# เว็บแอปผู้โดยสาร/คนขับ
server {
    listen 80;
    listen [::]:80;
    server_name example.com;

    location / {
        proxy_pass http://127.0.0.1:3302;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# แดชบอร์ดแอดมิน
server {
    listen 80;
    listen [::]:80;
    server_name admin.example.com;

    location / {
        proxy_pass http://127.0.0.1:3303;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# API + Socket.IO
server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    # อัปโหลดรูปเอกสาร/เซลฟี่ (API จำกัดไฟล์ละ 5MB อยู่แล้ว)
    client_max_body_size 8m;

    location / {
        proxy_pass http://127.0.0.1:3301;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket (Socket.IO) + ไม่ตัดการเชื่อมต่อที่เงียบนาน (ตำแหน่งคนขับ/แชต)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
    }
}
